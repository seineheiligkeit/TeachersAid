<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TeachersAid — Dashboard</title>
<style>
  :root { --bg:#f4f1ea; --ink:#1f3a52; --line:#d8d2c4; --accent:#b5651d; --ok:#2e6b3a; --bad:#8a1c1c; --soft:#eef3f7; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif; color:#222; background:var(--bg); }
  header { background:var(--ink); color:#fff; padding:9px 16px; display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  header .stat { font-size:12px; opacity:.9; }
  nav.tabbar { background:var(--ink); padding:0 12px; display:flex; gap:2px; }
  nav.tabbar button { border:none; background:none; color:#cdd8e2; padding:8px 14px; font:inherit; cursor:pointer; border-bottom:3px solid transparent; }
  nav.tabbar button.active { color:#fff; border-bottom-color:var(--accent); font-weight:600; }
  main { padding:14px 18px; }
  .grid2 { display:grid; grid-template-columns:minmax(340px,440px) 1fr; gap:14px; align-items:start; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:12px; }
  .card h2 { font-size:13px; margin:0 0 8px; color:var(--ink); text-transform:uppercase; letter-spacing:.04em; }
  .card h3 { font-size:13px; margin:10px 0 4px; color:var(--ink); }
  label { display:block; font-size:12px; color:#555; margin:6px 0 2px; }
  input, select, textarea { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  button { font:inherit; padding:6px 12px; border:1px solid var(--ink); background:var(--ink); color:#fff; border-radius:6px; cursor:pointer; }
  button.ghost { background:#fff; color:var(--ink); } button.ghost.active { background:var(--soft); }
  button.bad { border-color:var(--bad); color:var(--bad); background:#fff; }
  button.ok { border-color:var(--ok); background:var(--ok); }
  button:disabled { opacity:.45; cursor:default; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .between { justify-content:space-between; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td { text-align:left; padding:5px 6px; border-bottom:1px solid var(--line); }
  th { color:#555; font-weight:600; }
  .pill { display:inline-block; padding:1px 7px; border-radius:20px; font-size:11px; border:1px solid var(--line); }
  .s-pending{background:#fff7e6;} .s-approved{background:#e7f4ea;color:var(--ok);} .s-rejected{background:#fdecea;color:var(--bad);}
  .s-generating{background:#eef;} .s-changes_requested{background:#fff0f0;color:var(--bad);} .s-in_review{background:#fff7e6;}
  .badge { display:inline-block; padding:1px 6px; border-radius:5px; font-size:11px; background:var(--soft); color:var(--ink); margin-right:4px; }
  .src-ai{background:#efe9f7;color:#5a3a8a;} .src-user{background:#e9f0f7;color:var(--ink);}
  .gap { color:var(--bad); } .cov { color:var(--ok); } .muted { color:#777; font-size:12px; }
  .item { border:1px solid var(--line); border-radius:8px; padding:9px 10px; margin-bottom:8px; background:#fff; cursor:pointer; }
  .item.sel { outline:2px solid var(--accent); }
  .blk { border-left:3px solid var(--line); padding:6px 10px; margin:6px 0; background:#fbfaf7; border-radius:0 6px 6px 0; }
  .blk.task { border-left-color:var(--accent); }
  .blk.info { border-left-color:#9bb0c2; }
  .ans { background:#f0f6f0; border-radius:6px; padding:4px 8px; margin-top:4px; font-size:12.5px; }
  .watch { color:var(--accent); font-size:12px; }
  .pl { margin:5px 0 5px 6px; padding-left:16px; font-size:13px; }
  .pl li { margin:2px 0; }
  table.pl { border-collapse:collapse; margin:6px 0; } table.pl th, table.pl td { border:1px solid var(--line); padding:3px 7px; font-size:12.5px; text-align:left; }
  iframe { width:100%; height:600px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  .bars span { display:inline-block; height:11px; background:var(--ink); border-radius:2px; vertical-align:middle; }
  .prog { height:10px; background:var(--line); border-radius:6px; overflow:hidden; }
  .prog > i { display:block; height:100%; background:var(--ok); }
  code { background:#eee; padding:1px 4px; border-radius:4px; font-size:12px; }
  .figpre { margin:6px 0; }
  .figpre img { display:block; max-width:min(420px,100%); border:1px solid var(--line); border-radius:6px; background:#fff; padding:4px; }
  .gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; }
  .tile { border:1px solid var(--line); border-radius:8px; background:#fff; padding:8px; }
  .tile img { width:100%; max-height:200px; object-fit:contain; background:#fff; border-radius:4px; }
  .tile .meta { font-size:11.5px; color:#555; margin-top:6px; }
  .tile code { font-size:10.5px; }
  .fb { background:#fcfbf8; }
  .star { cursor:pointer; color:#e0a800; font-size:17px; line-height:1; }
  .chip { cursor:pointer; border:1px solid var(--line); border-radius:12px; padding:1px 8px; font-size:11px; color:#555; background:#fff; }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .fb-item { border-left:3px solid var(--line); padding:3px 9px; margin:4px 0; font-size:12.5px; background:#fbfaf7; border-radius:0 5px 5px 0; }
</style>
</head>
<body>
<header>
  <h1>TeachersAid · Dashboard</h1>
  <span class="stat" id="counts">…</span>
  <span class="stat">Bibliothek: <b id="libsize">0</b></span>
</header>
<nav class="tabbar" id="tabbar"></nav>
<main id="main"></main>

<script>
const TABS = [["planen","Planen"],["pruefen","Prüfen"],["korpus","Korpus"],["einblicke","Einblicke"]];
const KORPUS_VIEWS = [["blaetter","Arbeitsblätter"],["bausteine","Bausteine"],["arrangements","Arrangements"],["abbildungen","Abbildungen"],["datensaetze","Datensätze"],["texte","Texte"],["sachverhalte","Sachverhalte"]];
const FB_TAGS = ["zu leicht","zu schwer","Sachfehler","Sprache/Wortwahl","unklar","didaktisch stark","Bild/Abbildung nötig","super"];
let TAB = "planen", KORPUS_VIEW = "blaetter", SELECTED = null, VIEW = "bloecke", ARRVIEW = "vorschau", LASTITEMS = [];
const $ = s => document.querySelector(s);
const esc = s => (s==null?"":String(s)).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
async function jget(u){ return (await fetch(u)).json(); }
async function jpost(u,b){ return (await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})})).json(); }

function renderTabs(){
  $("#tabbar").innerHTML = TABS.map(([k,l])=>`<button class="${TAB===k?'active':''}" onclick="switchTab('${k}')">${l}</button>`).join("");
}
function switchTab(t){ TAB=t; SELECTED=null; renderTabs(); buildShell(); refresh(); }

function buildShell(){
  if(TAB==="planen"){
    $("#main").innerHTML = `
      <div class="grid2">
        <div>
          <div class="card"><h2>Neue Idee</h2>
            <label>Fach</label><input id="b-subject" value="Physik" />
            <div class="row"><div style="flex:1"><label>Klasse</label><input id="b-klasse" type="number" value="4" /></div>
              <div style="flex:2"><label>Thema</label><input id="b-topic" placeholder="z. B. Optische Systeme" /></div></div>
            <label>Notiz (grobe Idee)</label><textarea id="b-note" rows="2" placeholder="Worum geht es? Welcher Kern?"></textarea>
            <div class="row" style="margin-top:8px"><button onclick="addIdea()">Idee hinzufügen</button></div>
          </div>
          <div class="card"><h2>Vorschläge aus Lehrplan</h2>
            <p class="muted">Erzeugt je Kompetenzbereich der Klasse eine Roh-Idee (sofern noch offen).</p>
            <div class="row"><div style="flex:2"><label>Fach</label><input id="s-subject" value="Physik" /></div>
              <div style="flex:1"><label>Klasse</label><input id="s-klasse" type="number" value="4" /></div></div>
            <div class="row" style="margin-top:8px"><button class="ghost" onclick="suggest()">Vorschläge erzeugen</button></div>
          </div>
        </div>
        <div class="card"><h2>Ideen-Sammlung</h2><div id="bs-list"></div></div>
      </div>
      <div id="planner"><p class="muted">lädt…</p></div>`;
  } else if(TAB==="pruefen"){
    $("#main").innerHTML = `<div id="pruefen"><p class="muted">lädt…</p></div>`;
  } else if(TAB==="korpus"){
    $("#main").innerHTML = `
      <div class="row" id="korpus-nav" style="margin-bottom:10px;gap:6px;flex-wrap:wrap"></div>
      <div id="korpus-body"><p class="muted">lädt…</p></div>`;
  } else {
    $("#main").innerHTML = `<div id="insights"><p class="muted">lädt…</p></div><div id="stats"><p class="muted">lädt…</p></div>`;
  }
}

/* ---------- Korpus — sub-views over the material library ---------- */
function korpusShellHTML(v){
  if(v==="blaetter") return `
    <div class="grid2">
      <div>
        <div class="card"><h2>Arbeitsblatt zusammenstellen</h2>
          <p class="muted">Aus <b>freigegebenen</b> Bausteinen (dumb v1: passende Bausteine, nach Niveau geordnet, zeitlich begrenzt). Ziel über den <b>Kompetenzbereich</b> (robust) — oder per Thema, wenn der Titel zum Katalog passt.</p>
          <label>Fach</label><input id="c-subject" value="Physik" onchange="loadKBs()" />
          <div class="row"><div style="flex:1"><label>Klasse</label><input id="c-klasse" type="number" value="4" onchange="loadKBs()" /></div>
            <div style="flex:1"><label>Dauer</label><select id="c-env"><option>einzelstunde</option><option selected>doppelstunde</option><option>block</option></select></div></div>
          <label>Kompetenzbereich <span class="muted">(optional)</span></label>
          <select id="c-kb"><option value="">— per Thema auflösen —</option></select>
          <label>Thema / Titel</label><input id="c-topic" value="Strahlung und Radioaktivität" />
          <div class="row" style="margin-top:8px"><button onclick="composeSheet()">Zusammenstellen</button></div>
        </div>
        <div class="card"><h2>Varianten erzeugen</h2>
          <p class="muted">Aus einer geprüften parametrischen Vorlage: neue Zahlen, derselbe
            mathematische Kern, Lösung und Rechenweg deterministisch berechnet. Kein LLM-Aufruf.</p>
          <label>Vorlage</label><select id="v-template"><option value="">lädt…</option></select>
          <div class="row">
            <div style="flex:1"><label>Anzahl</label><input id="v-count" type="number" min="1" max="30" value="6"></div>
            <label style="flex:2;margin-top:24px"><input id="v-ramp" type="checkbox" style="width:auto;margin-right:6px">ansteigend (leicht → anspruchsvoll)</label>
          </div>
          <div class="row" style="margin-top:8px"><button onclick="composeVariants()">Varianten erzeugen</button></div>
          <p id="v-result" class="muted"></p>
        </div>
        <div class="card"><h2>Arbeitsblätter (freigegeben)</h2><div id="content-list"></div></div>
      </div>
      <div id="detail" class="card"><p class="muted">Wähle einen Eintrag.</p></div>
    </div>`;
  if(v==="bausteine") return `
    <div class="grid2">
      <div class="card"><h2>Baustein-Bibliothek</h2>
        <div class="row" style="margin-bottom:8px;flex-wrap:wrap;gap:6px">
          <select id="blk-subject" onchange="refresh()"><option value="">alle Fächer</option></select>
          <select id="blk-klasse" onchange="refresh()"><option value="">alle Klassen</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select>
          <select id="blk-status" onchange="refresh()"><option value="">alle Status</option><option value="in_review">in Prüfung</option><option value="approved">freigegeben</option><option value="rejected">abgelehnt</option></select>
          <select id="blk-role" onchange="refresh()"><option value="">alle Typen</option><option value="task">Aufgabe</option><option value="info">Info / Text</option></select>
          <button class="ghost" onclick="approveAllBlocks()">Alle in Prüfung freigeben</button>
        </div>
        <div id="blk-list"></div></div>
      <div id="detail" class="card"><p class="muted">Wähle links einen Baustein.</p></div>
    </div>`;
  if(v==="arrangements") return `
    <div class="grid2">
      <div class="card"><h2>Lernarrangements</h2>
        <p class="muted">Komposite Sibling-Objekte (v0.5), die Arbeitsblätter <i>enthalten</i>: Rollen, Phasen, gemeinsames Produkt und die mündlich/sozial/handelnd verankerten Kompetenzen, die ein einzelnes Blatt nicht erreicht.</p>
        <div id="arr-list"></div></div>
      <div id="detail" class="card"><p class="muted">Wähle links ein Arrangement.</p></div>
    </div>`;
  if(v==="abbildungen") return `
    <div class="card"><h2>Bibliotheks-Assets — Dekoration & Quellen</h2>
      <p class="muted">Datei-basierte Assets: <b>dekorativ</b> (inhaltsfrei, wiederverwendbar — svg/Code jetzt, Diffusion wenn das Bild-Agent angebunden ist) oder <b>extern mit Quelle/Rechten</b>. Hier prüfst und gibst du sie frei. Die Medien-Policy lässt nur inhaltsfreie Deko aus beliebiger Quelle zu.</p>
      <div id="asset-lib" class="gallery"><p class="muted">lädt…</p></div></div>
    <div class="card"><h2>Abbildungen aus Bausteinen & Arbeitsblättern</h2>
      <p class="muted">Jede code-generierte Inhalts-Figur (entdedupliziert nach Generator + Spezifikation), so wie sie im Material erscheint — fächerübergreifend an einer Stelle prüfbar (Korrektheit, Didaktik). Diese werden mit ihrem Baustein/Arbeitsblatt freigegeben.</p>
      <div class="row" style="margin:6px 0;gap:6px">
        <select id="ass-gen" onchange="renderAssets()"><option value="">alle Generatoren</option></select>
      </div>
      <div id="gallery" class="gallery"><p class="muted">lädt…</p></div></div>`;
  if(v==="datensaetze") return `
    <div class="card"><h2>Datensätze — geerdete Fakten (Quellen mit Lizenz)</h2>
      <p class="muted">Kuratierte, zitierte, lizenzgeprüfte öffentliche Daten (deterministisch von Tools geholt, kein LLM im Faktenweg). Inhalte <b>referenzieren</b> einen Datensatz per stabiler ID und dürfen einen Wert <b>verwenden, nie erfinden</b> — wie <code>serves</code> eine Kompetenz referenziert. Hier prüfst du Quelle, Lizenz und Abbildung und gibst frei.</p>
      <div id="dataset-lib" class="gallery"><p class="muted">lädt…</p></div></div>`;
  if(v==="texte") return `
    <div class="card"><h2>Texte — annotierte authentische Texte (Deutsch)</h2>
      <p class="muted">Echte, rechtlich geklärte Texte (gemeinfrei nach AT-70-Jahre-Regel oder CC) mit einer <b>geprüften Annotationsebene</b>. Aufgaben werden daraus abgeleitet — die Antworten stammen aus den Annotationen (korrekt durch Kuration, nicht erfunden). „Arbeitsblatt erzeugen“ stellt ein abgeleitetes Arbeitsblatt in <b>Prüfen</b> ein.</p>
      <div id="text-lib"><p class="muted">lädt…</p></div></div>`;
  return `
    <div class="card"><h2>Sachverhalte — kuratierte Sachwissen-Module (Darstellung + Fakten)</h2>
      <p class="muted">Strukturierte, belegte Fakten (Zeitleiste · Akteure · Ursache→Folge · Begriffe) plus eine <b>autorisierte Darstellung über dem eingefrorenen Faktenset</b> — jede Jahreszahl ist per Entity-Lint garantiert, kein erfundenes Datum. Ein Modul → drei Projektionen (Darstellung · Abbildungen · Sachkompetenz-Aufgaben). Hier prüfst du <b>Fakten und Quellen</b> und gibst frei; „Arbeitsblatt erzeugen“ stellt es in <b>Prüfen</b> ein.</p>
      <div id="sach-lib"><p class="muted">lädt…</p></div></div>`;
}
function renderKorpus(){
  const nav=$("#korpus-nav"), body=$("#korpus-body");
  if(!nav||!body) return;
  nav.innerHTML = KORPUS_VIEWS.map(([k,l])=>`<button class="ghost ${KORPUS_VIEW===k?'active':''}" onclick="setKorpusView('${k}')">${l}</button>`).join("");
  if(body.dataset.view!==KORPUS_VIEW){   // build the sub-shell only on view change — keeps form state across the 4s refresh
    body.dataset.view=KORPUS_VIEW;
    body.innerHTML=korpusShellHTML(KORPUS_VIEW);
    if(KORPUS_VIEW==="blaetter"){ loadKBs(); loadTemplates(); }
  }
  if(KORPUS_VIEW==="blaetter") renderContentList(LASTITEMS.filter(i=>i.stage==="content" && i.status==="approved"));
  else if(KORPUS_VIEW==="bausteine") renderBlocks();
  else if(KORPUS_VIEW==="arrangements") renderArrangements();
  else if(KORPUS_VIEW==="abbildungen") renderAssets();
  else if(KORPUS_VIEW==="datensaetze") renderDatasets();
  else if(KORPUS_VIEW==="texte") renderTexts();
  else if(KORPUS_VIEW==="sachverhalte") renderSachverhalte();
}
function setKorpusView(v){ KORPUS_VIEW=v; SELECTED=null; renderKorpus(); }

async function refresh(){
  const st = await jget("/api/status");
  $("#counts").textContent = Object.entries(st.counts).map(([k,v])=>`${k}: ${v}`).join("  ·  ") || "leer";
  $("#libsize").textContent = st.library_size;
  LASTITEMS = st.items;
  if(TAB==="planen") renderPlanen();
  else if(TAB==="pruefen") renderPruefen();
  else if(TAB==="korpus") renderKorpus();
  else if(TAB==="einblicke") renderEinblicke();
}

/* ---------- Brainstorm ---------- */
function renderBrainstorm(){
  const items = LASTITEMS.filter(i=>i.stage==="brainstorm");
  if(!$("#bs-list")) return;
  if(!items.length){ $("#bs-list").innerHTML = `<p class="muted">Noch keine Ideen. Füge eine hinzu oder erzeuge Vorschläge.</p>`; return; }
  $("#bs-list").innerHTML = items.map(i=>{
    const actions = i.status==="pending" || i.status==="changes_requested"
      ? `<button class="ok" onclick="act('${i.id}','approve')">Annehmen</button>
         <button class="bad" onclick="act('${i.id}','reject')">Ablehnen</button>`
      : i.status==="approved"
        ? `<button onclick="fleshOut('${i.id}')">Ausarbeiten →</button>`
        : `<span class="muted">abgelehnt</span>`;
    return `<div class="item">
      <div class="row between"><b>${esc(i.topic)}</b><span class="pill s-${i.status}">${i.status}</span></div>
      <div class="muted">${esc(i.subject)} ${i.klasse}. Kl. · <span class="badge src-${i.source}">${i.source==='ai'?'KI':'manuell'}</span></div>
      ${i.note?`<div style="margin:4px 0">${esc(i.note)}</div>`:""}
      <div class="row" style="margin-top:6px">${actions}</div></div>`;
  }).join("");
}
async function addIdea(){
  const topic = $("#b-topic").value.trim(); if(!topic){ $("#b-topic").focus(); return; }
  await jpost("/api/brainstorm",{subject:$("#b-subject").value,klasse:+$("#b-klasse").value,topic,note:$("#b-note").value});
  $("#b-topic").value=""; $("#b-note").value=""; refresh();
}
async function suggest(){ await jpost("/api/brainstorm/suggest",{subject:$("#s-subject").value,klasse:+$("#s-klasse").value}); refresh(); }
async function fleshOut(id){
  const r = await jpost(`/api/items/${id}/flesh-out`,{});
  TAB="korpus"; KORPUS_VIEW="blaetter"; SELECTED=r.id||null; VIEW="bloecke"; renderTabs(); buildShell(); await refresh(); if(SELECTED) openDetail(SELECTED);
}
async function loadKBs(){
  const sel=$("#c-kb"); if(!sel) return;
  const subject=$("#c-subject").value, klasse=+$("#c-klasse").value, keep=sel.value;
  try{
    const r=await jget(`/api/kompetenzbereiche?subject=${encodeURIComponent(subject)}&klasse=${klasse}`);
    sel.innerHTML = `<option value="">— per Thema auflösen —</option>` +
      (r.kompetenzbereiche||[]).map(k=>`<option ${k===keep?"selected":""}>${esc(k)}</option>`).join("");
  }catch(e){ /* leave the topic-only fallback in place */ }
}
async function composeSheet(){
  const topic=$("#c-topic").value.trim(), kb=$("#c-kb")?$("#c-kb").value:"";
  if(!topic && !kb){ $("#c-topic").focus(); return; }
  const r = await jpost("/api/compose",{subject:$("#c-subject").value,klasse:+$("#c-klasse").value,
    topic,envelope:$("#c-env").value,kompetenzbereich:kb||null});
  if(r.error){ alert("Konnte nicht zusammenstellen:\n"+r.error); }
  SELECTED=r.id||null; VIEW="bloecke"; await refresh(); if(SELECTED) openDetail(SELECTED);
}
async function loadTemplates(){
  const sel=$("#v-template"); if(!sel) return;
  try{
    const rows=await jget("/api/templates");
    sel.innerHTML=rows.map(t=>`<option value="${esc(t.id)}">${esc(t.subject)} ${t.klasse}. Kl. — ${esc(t.title)} · ${esc((t.anchor||[]).join(", "))}</option>`).join("");
  }catch(e){ sel.innerHTML=`<option value="">Vorlagen nicht ladbar</option>`; }
}
async function composeVariants(){
  const template_id=$("#v-template").value, n=+$("#v-count").value;
  if(!template_id){ $("#v-template").focus(); return; }
  const result=$("#v-result"); result.textContent="wird berechnet und gerendert…";
  const r=await jpost("/api/variants",{template_id,n,ramp:$("#v-ramp").checked});
  if(r.error){ result.textContent="Fehler: "+r.error; return; }
  result.textContent=`${r.id} wurde in „Prüfen“ eingestellt.`;
  SELECTED=r.id||null; VIEW="vorschau"; await refresh(); if(SELECTED) openDetail(SELECTED);
}

/* ---------- Inhalte / Bibliothek ---------- */
function renderContentList(items){
  if(!$("#content-list")) return;
  $("#content-list").innerHTML = items.length ? items.map(i=>{
    const cov = i.covered==null?"":`<span class="cov">${i.covered}✓</span>${i.gaps?` <span class="gap">${i.gaps}✗</span>`:""} · ${i.tasks||0} Aufg.`;
    return `<div class="item ${SELECTED===i.id?'sel':''}" onclick="openDetail('${i.id}')">
      <div class="row between"><b>${esc(i.topic)}</b><span class="pill s-${i.status}">${i.status}</span></div>
      <div class="muted">${esc(i.subject)} ${i.klasse}. Kl. · ${cov}</div>
      ${i.error?`<div class="gap">⚠ ${esc(i.error)}</div>`:""}</div>`;
  }).join("") : `<p class="muted">keine Einträge</p>`;
}
function setView(v){ VIEW=v; openDetail(SELECTED); }
async function openDetail(id){
  SELECTED=id; if($("#content-list")) renderContentList(LASTITEMS.filter(i=>i.stage==="content" && i.status==="approved"));
  const it = await jget("/api/items/"+id);
  const c = it.content;
  let h = `<div class="row between"><div><h2 style="margin:0">${esc(it.title)}</h2>
      <span class="pill s-${it.status}">${it.status}</span></div>
      <div class="row"><button class="ghost ${VIEW==='bloecke'?'active':''}" onclick="setView('bloecke')">Blöcke</button>
      <button class="ghost ${VIEW==='vorschau'?'active':''}" onclick="setView('vorschau')">Vorschau</button></div></div>`;
  if(it.error) h += `<p class="gap">⚠ ${esc(it.error)}</p>`;
  if(it.status==="generating") h += `<p>⏳ wird ausgearbeitet…</p>`;

  if(VIEW==="vorschau"){
    h += `<div class="row" style="margin:8px 0"><button class="ghost" onclick="showpdf('${id}','student')">Schüler</button>
      <button class="ghost" onclick="showpdf('${id}','teacher')">Lehrkraft</button>
      <button class="ghost" onclick="showpdf('${id}','homework')">Hausübung</button></div>
      <iframe id="pdfframe" src="/api/items/${id}/pdf/student"></iframe>`;
  } else if(c){
    // ---- Blöcke (structured content, independent of rendering) ----
    h += `<p class="muted">${esc(c.meta.lehrplan_label||"")} · ${esc(c.meta.fassung.bgbl)}</p>`;
    if(c.meta.kernfrage) h += `<p><b>Kernfrage:</b> ${esc(rt(c.meta.kernfrage))}</p>`;
    const imgSrc = r=>`/api/items/${id}/asset/${encodeURIComponent(r)}`;
    (c.intro||[]).forEach(b=> h += blk(b,null,imgSrc));
    (c.sections||[]).forEach(sec=>{
      h += `<h3>${esc(sec.title)}</h3>`;
      if(sec.teacher_overview && sec.teacher_overview.throughline) h+=`<p class="muted">${esc(sec.teacher_overview.throughline)}</p>`;
      let n=0; (sec.blocks||[]).forEach(b=> h += blk(b, b.role==="task"?++n:null, imgSrc));
    });
    if(c.nachweis) h += nachweis(c.nachweis);
    if(c.depth_profile) h += depth(c.depth_profile);
    if(it.verify_problems && it.verify_problems.length) h += `<div class="ans"><b class="gap">Verify-Probleme:</b> ${it.verify_problems.map(esc).join("; ")}</div>`;
  } else h += `<p class="muted">Noch kein Inhalt.</p>`;

  // actions
  const inLib = it.status==="approved";
  const canApprove = c && (it.verify_problems||[]).length===0 && it.status!=="generating" && !inLib;
  h += `<div class="card" style="margin-top:12px"><h2>Aktionen</h2>
    <textarea id="note" rows="2" placeholder="Notiz für 'Änderungen anfordern'…"></textarea>
    <div class="row" style="margin-top:8px">
      <button class="ok" ${canApprove?"":"disabled"} onclick="act('${id}','approve')">In Bibliothek freigeben</button>
      <button class="ghost" onclick="act('${id}','request-changes')">Änderungen anfordern</button>
      <button class="bad" onclick="act('${id}','reject')">Ablehnen</button></div></div>`;
  h += feedbackPanel("item", id);
  $("#detail").innerHTML = h;
  loadFeedback("item", id);
}
function rt(v){ return Array.isArray(v)? v.map(r=>r.text).join("") : v; }
function pl(p){
  // render the task payload — the actual input the student works with
  if(!p) return "";
  if(p.kind==="true_false_justify") return `<ol class="pl">${(p.statements||[]).map(s=>`<li>${esc(s)}</li>`).join("")}</ol>`;
  if(p.kind==="multiple_choice") return `<div class="pl">${(p.options||[]).map(o=>`<div>☐ ${esc(o)}</div>`).join("")}</div>`;
  if(p.kind==="ordering") return `<div class="pl">${(p.items||[]).map(i=>`<div>____ ${esc(i)}</div>`).join("")}</div>`;
  if(p.kind==="matching"){ const r=p.right||[]; return `<div class="pl">${(p.left||[]).map((l,i)=>`<div>${esc(l)} → ${esc(r[i]||"____")}</div>`).join("")}</div>`; }
  if(p.kind==="table_fill"){ const head=(p.columns||[]).map(c=>`<th>${esc(c)}</th>`).join(""); const rows=(p.rows||[]).map(row=>`<tr>${(row||[]).map(c=>`<td>${c==null?"":esc(c)}</td>`).join("")}</tr>`).join(""); return `<table class="pl"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`; }
  if(p.kind==="decision_scenario") return `<div class="pl">${esc(rt(p.stem))}</div>`;
  return "";
}
function figs(b, imgSrc){
  // inline-preview every figure the block references, built on demand from its spec
  if(!imgSrc) return "";
  return (b.asset_refs||[]).map(r=>`<div class="figpre"><img src="${imgSrc(r)}" alt="${esc(r)}"
    loading="lazy" onerror="pImgErr(this)"></div>`).join("");
}
function prov(b){
  // expression-provenance panel (History/GPB): origin + obligation + the full sources list,
  // incl. the role="facts" records hidden from students — the basis the SME fact-checks.
  const p=b.provenance; if(!p) return "";
  const tag={original:"eigene Formulierung",adapted:"adaptiert (Paraphrase)",quoted:"wörtliches Zitat"}[p.expression_origin]||p.expression_origin;
  const flags=(p.attribution_required?' · <b>Quellenangabe erforderlich</b>':'')+(p.share_alike_applies?' · <span class="gap">ShareAlike</span>':'');
  const rl={facts:"Fakten",expression:"Formulierung"};
  const src=(p.sources||[]).map(s=>`<div class="muted">– [${rl[s.role]||s.role}] „${esc(s.title)}“${s.publisher?', '+esc(s.publisher):''}${s.licence?', '+esc(s.licence):''}${s.retrieved?' (abgerufen '+esc(s.retrieved)+')':''}${s.url?` — <a href="${esc(s.url)}" target="_blank" rel="noopener">Quelle</a>`:''}</div>`).join("");
  return `<div style="margin-top:4px;border-left:3px solid #b39ddb;padding-left:6px"><span class="badge">Provenienz: ${esc(tag)}</span>${flags}${src}</div>`;
}
function blk(b, num, imgSrc){
  if(b.role==="info"){
    return `<div class="blk info"><span class="badge">${b.kind}</span>${esc(rt(b.content))}
      ${figs(b, imgSrc)}${prov(b)}
      ${(b.watch_outs||[]).map(w=>`<div class="watch">⚠ ${esc(w)}</div>`).join("")}</div>`;
  }
  const resp = b.response? ({lines:`${b.response.n} Zeilen`,box:`Box ${b.response.min_height_mm||''}mm`,table:'Tabelle',choices:'Auswahl',none:'mündlich/keine',diagram:'Diagramm',drawing:'Skizze',artifact:'Produkt'}[b.response.mode]||b.response.mode):"";
  const serves = (b.serves||[]).map(s=>`<code>${s.competence_id}</code>`).join(" ");
  return `<div class="blk task"><div><b>${num?num+'. ':''}</b>${esc(rt(b.prompt))}</div>
    ${figs(b, imgSrc)}
    ${pl(b.payload)}
    <div style="margin-top:4px"><span class="badge">${b.kind}</span><span class="badge">${b.cognitive_level}</span>
      <span class="badge">Dim ${(b.dimensions||[]).join(",")}</span><span class="badge">~${b.est_minutes}′</span>
      <span class="badge">Antwort: ${resp}</span></div>
    ${serves?`<div class="muted" style="margin-top:3px">dient: ${serves}</div>`:""}
    ${b.answer_key?`<div class="ans"><b>Lösung:</b> ${esc(rt(b.answer_key))}</div>`:""}
    ${b.acceptable_reasoning?`<div class="ans"><b>Spielraum:</b> ${esc(rt(b.acceptable_reasoning))}</div>`:""}
    ${(b.rubric||[]).map(r=>`<div class="muted">Kriterium — ${esc(r.criterion)}: ${(r.levels||[]).map(esc).join(" / ")}</div>`).join("")}
    ${prov(b)}
    ${(b.watch_outs||[]).map(w=>`<div class="watch">⚠ ${esc(w)}</div>`).join("")}</div>`;
}
function nachweis(n){
  return `<div class="card" style="margin-top:10px"><h2>Nachweis (abgeleitet)</h2>
    <table><thead><tr><th>Kompetenz</th><th>Status</th></tr></thead><tbody>
    ${n.competence_coverage.map(x=>`<tr><td><code>${x.competence_id}</code></td><td>${x.covered?'<span class="cov">✓ abgedeckt</span>':'<span class="gap">✗ Lücke</span>'}</td></tr>`).join("")}
    </tbody></table>${n.gaps.length?`<p class="gap"><b>Lücken:</b> ${n.gaps.map(esc).join("; ")}</p>`:""}
    <p class="muted">Übergreifende Themen: ${(n.uebergreifende_themen||[]).join(", ")||"—"}</p></div>`;
}
function depth(d){
  const order=["remember","understand","apply","analyze","evaluate","create"];
  const bars = order.filter(l=>d.by_level[l]).map(l=>`<div>${l}: <span class="bars" style="width:${14*d.by_level[l]}px"></span> ${d.by_level[l]}</div>`).join("");
  const dl={1:"leicht",2:"mittel",3:"anspruchsvoll"};
  const diff=d.by_difficulty?[1,2,3].filter(k=>d.by_difficulty[k]).map(k=>`${dl[k]}: ${d.by_difficulty[k]}`).join(" · "):"";
  return `<div class="card" style="margin-top:10px"><h2>Tiefenprofil (abgeleitet)</h2>${bars}
    <p>Dimensionen: ${Object.entries(d.by_dimension).map(([k,v])=>k+":"+v).join(" · ")}</p>
    ${diff?`<p>Anforderung (geschätzt): ${diff}</p>`:""}
    <p class="muted">Zeit gesamt ${d.minutes_total}′ · materialunabhängig ${d.minutes_resource_independent}′</p></div>`;
}

/* ---------- Arrangements (Lernarrangement v0.5) ---------- */
const _GRP={individual:"Einzeln",role_group:"Gruppen-/Fraktionsarbeit",home_group:"Stammgruppe",plenary:"Plenum"};
const _SB={interaction:"Interaktion / Debatte",debrief:"Reflexion (Debrief)",shared_product:"Gemeinsames Produkt"};
function _sbLabel(s,roles){ if(s&&s.startsWith("role:")){ const r=roles.find(x=>x.id===s.slice(5)); return "Rolle: "+(r?rt(r.label):s.slice(5)); } return _SB[s]||s; }
function _roleServed(role){ const ids=new Set(); (role.material.sections||[]).forEach(s=>(s.blocks||[]).forEach(b=>{ if(b.role==='task')(b.serves||[]).forEach(x=>ids.add(x.competence_id)); })); return [...ids]; }
async function renderArrangements(){

    <div class="item ${SELECTED===a.id?'sel':''}" onclick="openArrangement('${a.id}')">

      ${a.problems?`<div class="gap">⚠ ${a.problems} Verify-Probleme</div>`:''}</div>`).join("")

}
function setArrView(v){ ARRVIEW=v; openArrangement(SELECTED); }
function arrpdf(id,key){ const f=$("#arrframe"); if(f) f.src=`/api/arrangements/${id}/pdf/${key}`; }
async function openArrangement(id){

      <button class="ghost ${ARRVIEW==='struktur'?'active':''}" onclick="setArrView('struktur')">Struktur</button></div></div>
    <p class="muted">${esc(m.subject)} ${m.klasse}. Kl. · Format: ${esc(m.format)} · ${a.phases.reduce((s,p)=>s+p.minutes,0)}′ · ${roles.length} Rollen</p>`;
  if(m.kernfrage) h += `<p><b>Kernfrage:</b> ${esc(rt(m.kernfrage))}</p>`;
  if((rec.verify_problems||[]).length) h += `<div class="ans"><b class="gap">Verify-Probleme:</b> ${rec.verify_problems.map(esc).join("; ")}</div>`;

    (arts.roles||[]).forEach(r=> btns += ` <button class="ghost" onclick="arrpdf('${id}','${r.id}/student')">${esc(r.label)} · SuS</button>`
      + `<button class="ghost" onclick="arrpdf('${id}','${r.id}/teacher')">${esc(r.label)} · LK</button>`);
    h += `<div class="row" style="margin:8px 0;flex-wrap:wrap;gap:6px">${btns}</div>
      <iframe id="arrframe" src="/api/arrangements/${id}/pdf/orchestration"></iframe>`;
  } else {
    if(a.common_material&&a.common_material.length){ h += `<h3>Der Fall</h3>`; a.common_material.forEach(b=> h += blk(b,null)); }
    h += `<h3>Ablauf</h3><table><thead><tr><th>#</th><th>Phase</th><th>Sozialform</th><th>Min</th><th>Was passiert</th></tr></thead><tbody>`
      + a.phases.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.label)}</td><td>${_GRP[p.grouping]||p.grouping}</td><td>${p.minutes}</td><td>${esc(rt(p.what_happens))}</td></tr>`).join("") + `</tbody></table>`;
    h += `<h3>Rollen</h3><table><thead><tr><th>Rolle</th><th>Schwerpunkt-Kompetenzen</th></tr></thead><tbody>`
      + roles.map(r=>`<tr><td>${esc(rt(r.label))}</td><td>${_roleServed(r).map(c=>`<code>${c}</code>`).join(' ')||'—'}</td></tr>`).join("") + `</tbody></table>`;
    if(a.shared_product){ h += `<h3>Gemeinsames Produkt</h3><p>${esc(rt(a.shared_product.description))}</p>`;
      (a.shared_product.rubric||[]).forEach(rc=> h += `<div class="muted">Kriterium — ${esc(rc.criterion)}: ${(rc.levels||[]).map(esc).join(" → ")}</div>`); }
    if((a.competence_anchors||[]).length){ h += `<h3>Kompetenz-Verankerung <span class="muted">(über die Interaktion)</span></h3>`
      + `<table><thead><tr><th>Kompetenz</th><th>Dimension</th><th>verankert über</th></tr></thead><tbody>`
      + a.competence_anchors.map(x=>`<tr><td><code>${x.competence_id}</code></td><td>${esc(x.dimension)}</td><td>${esc(_sbLabel(x.served_by,roles))}</td></tr>`).join("") + `</tbody></table>`; }
    if(a.nachweis) h += nachweis(a.nachweis);
    if(a.depth_profile) h += depth(a.depth_profile);
  }
  const inLib = rec.status==="approved";
  h += `<div class="card" style="margin-top:12px"><h2>Aktionen</h2><div class="row">
    <button class="ok" ${inLib||(rec.verify_problems||[]).length?'disabled':''} onclick="actArrangement('${id}','approve')">In Bibliothek freigeben</button>
    <button class="bad" onclick="actArrangement('${id}','reject')">Ablehnen</button></div></div>`;
  h += feedbackPanel("arrangement", id);
  $("#detail").innerHTML = h;
  loadFeedback("arrangement", id);
}

/* ---------- Feedback (rating + comment + tags; the HITL loop) ---------- */
function _fbk(kind,id){ return (kind+"__"+id).replace(/[^a-zA-Z0-9_]/g,"_"); }
function feedbackPanel(kind,id){
  const k=_fbk(kind,id);
  return `<div class="card fb" data-k="${k}"><h2>Feedback</h2>
    <div class="row" style="gap:3px;align-items:center"><span class="muted">Bewertung:</span>
      ${[1,2,3,4,5].map(n=>`<span class="star" onclick="fbStar('${k}',${n})">☆</span>`).join("")}
      <input type="hidden" id="fbr_${k}"></div>
    <div class="row" style="gap:5px;flex-wrap:wrap;margin:7px 0">
      ${FB_TAGS.map(t=>`<span class="chip" onclick="this.classList.toggle('on')">${esc(t)}</span>`).join("")}</div>
    <textarea id="fbc_${k}" rows="2" placeholder="Kommentar — was ist gut, was fehlt, was ist falsch? (genuines Urteil hilft am meisten)"></textarea>
    <div class="row" style="margin-top:6px">
      <button class="ok" onclick="saveFeedback('${kind}','${id}',false)">Feedback speichern</button>
      ${kind==="item"?`<button class="ghost" onclick="saveFeedback('${kind}','${id}',true)">Mit Feedback überarbeiten →</button>`
        :`<button class="ghost" onclick="saveFeedback('${kind}','${id}',true)">Zur Überarbeitung vormerken</button>`}</div>
    <div id="fbl_${k}" style="margin-top:8px"></div></div>`;
}
function feedbackMini(kind,id){
  const k=_fbk(kind,id);
  return `<div class="fb fbmini" data-k="${k}" style="margin-top:6px;border-top:1px solid var(--line);padding-top:5px">
    <div class="row" style="gap:2px;align-items:center">${[1,2,3,4,5].map(n=>`<span class="star" onclick="fbStar('${k}',${n})">☆</span>`).join("")}<input type="hidden" id="fbr_${k}"></div>
    <input id="fbc_${k}" placeholder="kurzer Kommentar…" style="font-size:12px;margin-top:4px">
    <div class="row" style="margin-top:4px"><button class="ghost" style="font-size:11px;padding:3px 8px" onclick="saveFeedback('${kind}','${id}',false)">Feedback</button></div></div>`;
}
function fbStar(k,n){ const el=document.getElementById("fbr_"+k); if(el)el.value=n;
  const card=document.querySelector(`.fb[data-k="${k}"]`);
  if(card) card.querySelectorAll(".star").forEach((s,i)=> s.textContent=(i<n)?"★":"☆"); }
async function saveFeedback(kind,id,revise){
  const k=_fbk(kind,id), card=document.querySelector(`.fb[data-k="${k}"]`);
  const rv=document.getElementById("fbr_"+k).value, rating=rv?+rv:null;
  const comment=document.getElementById("fbc_"+k).value;
  const tags=card?[...card.querySelectorAll(".chip.on")].map(c=>c.textContent):[];
  if(rating==null && !comment.trim() && !tags.length && !revise) return;
  await jpost("/api/feedback",{target_kind:kind,target_id:id,rating,comment,tags,revise});
  document.getElementById("fbc_"+k).value=""; document.getElementById("fbr_"+k).value="";
  if(card){ card.querySelectorAll(".chip.on").forEach(c=>c.classList.remove("on"));
            card.querySelectorAll(".star").forEach(s=>s.textContent="☆"); }
  if(revise && kind==="item") setTimeout(refresh,200); else loadFeedback(kind,id);
}
async function loadFeedback(kind,id){
  const el=document.getElementById("fbl_"+_fbk(kind,id)); if(!el) return;
  const fb=await jget(`/api/feedback?target_kind=${kind}&target_id=${encodeURIComponent(id)}`);
  el.innerHTML = fb.length ? `<div class="muted"><b>Bisheriges Feedback (${fb.length})</b></div>`+fb.map(fbRow).join("")
    : `<span class="muted">Noch kein Feedback zu diesem Element.</span>`;
}
function fbRow(f){
  const stars="★".repeat(f.rating||0)+"☆".repeat(5-(f.rating||0));
  const where = f.label?`<b>${esc(f.label)}</b> <span class="badge">${esc(f.target_kind)}</span> ${esc(f.subject||"")}`:"";
  return `<div class="fb-item">${where} <span class="star">${stars}</span> ${f.revise?'<span class="badge">↻ überarbeiten</span>':''} ${(f.tags||[]).map(t=>`<span class="badge">${esc(t)}</span>`).join("")}${f.comment?`<div>${esc(f.comment)}</div>`:""}<div class="muted">${esc(f.at)}</div></div>`;
}

    <p class="muted">Noch kein Feedback. Bewerte und kommentiere Bausteine, Arbeitsblätter, Arrangements oder Assets — hier verdichtet es sich zu Hinweisen, die in neue Ideen und Verbesserungsschritte umgesetzt werden.</p></div>`; return; }
  let h=`<div class="card"><h2>Insights aus deinem Feedback</h2>
    <p class="muted">${d.total} Rückmeldungen · ⌀ ${d.avg_rating??"—"} ★ · ${Object.entries(d.by_kind).map(([k,v])=>k+": "+v).join(" · ")}</p>
    <p class="muted">Das ist die verdichtete menschliche Bewertung, die ich (zwischen den Sitzungen) lese und in Verbesserungen umsetze.</p></div>`;
  if(d.attention.length) h+=`<div class="card"><h2 class="gap">Zu überarbeiten — Priorität (${d.attention.length})</h2>
    <p class="muted">Niedrig bewertet, als „überarbeiten" markiert oder mit kritischem Tag (z. B. Sachfehler).</p>${d.attention.map(fbRow).join("")}</div>`;

  if(d.by_subject.length) h+=`<div class="card"><h2>Pro Fach</h2><table><thead><tr><th>Fach</th><th>n</th><th>⌀ ★</th></tr></thead><tbody>${d.by_subject.map(s=>`<tr><td>${esc(s.subject)}</td><td>${s.n}</td><td>${s.avg_rating??"—"}</td></tr>`).join("")}</tbody></table></div>`;
  if(d.praise.length) h+=`<div class="card"><h2 class="cov">Was funktioniert (${d.praise.length})</h2><p class="muted">Hoch bewertet — das Muster beibehalten.</p>${d.praise.slice(0,8).map(fbRow).join("")}</div>`;
  $("#insights").innerHTML=h;
}

  const body={subject:$("#dl-subject").value,klasse:+$("#dl-klasse").value,
    topic:$("#dl-topic").value,envelope:$("#dl-envelope").value};
  try{
    const r=await jpost("/api/deliver",body);
    const extra=r.mode==="gap"?"":` — ${r.n_tasks} Aufgaben, ~${r.est_minutes} min`;
    $("#dl-result").textContent=`[${r.mode}] ${r.note}${extra}`;
    if(r.mode==="gap") setTimeout(refresh,150);
  }catch(e){ $("#dl-result").textContent="Fehler: "+e; }
}
async function demandStatus(id,status){
  await jpost(`/api/demand/${id}/status`,{status}); setTimeout(refresh,150);
}

/* ---------- Prüfen — the unified gate (focus mode + keyboard) ---------- */
let PQ={all:[],entries:[],idx:0,lane:"",lanes:{},labels:{},details:{}};
async function renderPruefen(){
  if(!$("#pruefen")) return;
  const q=await jget("/api/review-queue");
  const keep=(PQ.entries[PQ.idx]||{}).id;
  PQ.all=q.entries; PQ.lanes=q.lanes; PQ.labels=q.tier_labels;
  PQ.entries=PQ.all.filter(e=>!PQ.lane||e.tier===PQ.lane);
  const at=PQ.entries.findIndex(e=>e.id===keep);
  PQ.idx=at>=0?at:0;
  drawPruefen();
}
function drawPruefen(){
  const LANES=["bestaetigen","quelle","sprache","voll"];
  const lane=(t,label,n)=>`<div onclick="setLane('${t}')" style="padding:7px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;font-size:13px;${PQ.lane===t?'background:#fff;border:1px solid #bbb;font-weight:600':'color:#555'}"><span>${label}</span><b>${n}</b></div>`;
  let rail=`<p class="muted" style="font-size:11px;letter-spacing:.04em;margin:0 0 6px">LANES (PRÜF-TIEFE)</p>`
    + lane("", "Alle", PQ.all.length)
    + LANES.map(t=>lane(t, PQ.labels[t].split(" — ")[0], PQ.lanes[t]||0)).join("")
    + ((PQ.lanes.bestaetigen||0)>0?`<button style="margin-top:10px;width:100%" onclick="laneApprove()">„Nur bestätigen" gesamt freigeben</button>`:"");
  const e=PQ.entries[PQ.idx];
  let card;
  if(!e){
    card=`<p class="muted">Nichts zu prüfen${PQ.lane?" in dieser Lane":""} — der Korpus ist auf Stand.</p>`;
  } else {
    const warn=(e.warnings||[]).map(w=>`<div style="background:#fdf3e0;color:#8a5a00;border-radius:8px;padding:7px 11px;font-size:12.5px;margin:4px 0">⚠ ${esc(w)}</div>`).join("")
      +(e.n_warnings>4?`<p class="muted" style="font-size:12px">… + ${e.n_warnings-4} weitere Hinweise</p>`:"");
    const prev=e.kind==="item"
      ?`<div class="row" style="gap:6px;margin:8px 0 4px"><button class="ghost" onclick="pFrame('${e.id}','student')">SuS</button><button class="ghost" onclick="pFrame('${e.id}','teacher')">LK</button><button class="ghost" onclick="pFrame('${e.id}','homework')">HÜ</button></div><iframe id="pframe" src="/api/items/${e.id}/pdf/student" style="width:100%;height:420px;border:1px solid #ddd;border-radius:8px"></iframe>`
      :e.kind==="asset"
      ?`<img src="/api/asset-library/${e.id}/file" style="max-width:320px;max-height:220px;border:1px solid #ddd;border-radius:8px;margin:8px 0" onerror="pImgErr(this)">`
      :pDetail(e);
    const tri=e.triage?`<p class="muted" style="font-size:12px;margin:0 0 6px">Triage: ${e.triage.score}${(e.triage.reasons||[]).length?` — ${e.triage.reasons.slice(0,2).map(esc).join(" · ")}`:""}${e.triage.rating?` · ★${e.triage.rating}`:""}</p>`:"";
    const revChip=e.revise_flagged?` <span class="pill" style="background:#fdf3e0;color:#8a5a00;border-color:#e8d5ac">Überarbeiten ✎</span>`:"";
    card=`<div class="row between"><span><span class="pill">${esc(e.kind)}</span> <code>${e.id}</code> <span class="muted">· ${esc(PQ.labels[e.tier])}</span>${revChip}</span><span class="muted">${PQ.idx+1} / ${PQ.entries.length}</span></div>
      <h2 style="margin:8px 0 2px">${esc(e.title||"")}</h2>
      <p class="muted" style="margin:0 0 6px">${esc(e.subject||"—")}${e.klasse?` · ${e.klasse}. Kl.`:""}${e.n_tasks?` · ${e.n_tasks} Aufgaben`:""}</p>
      ${tri}${warn}${prev}
      <div class="row" style="gap:8px;margin-top:10px">
        <button onclick="pDecide('approve')">Freigeben (a)</button>
        <button class="ghost" onclick="pDecide('revise')">Überarbeiten (u)</button>
        <button class="ghost" onclick="pDecide('reject')">Ablehnen (x)</button>
        <span class="muted" style="margin-left:auto">Tasten: j/k blättern · a/u/x entscheiden · 1–5 Bewertung</span></div>
      <p id="p-flash" class="muted" style="font-size:12px;margin:6px 0 0"></p>`;
  }
  $("#pruefen").innerHTML=`<div style="display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px">
    <div>${rail}</div><div class="card">${card}</div></div>`;
}

/* ---- Prüfen focus-card detail: every kind judgeable in place ----
   The card fetches the SAME records the Korpus sub-views read (no new endpoints),
   lazily for the CURRENT entry only, cached in PQ.details by kind:id so j/k stays
   snappy. Failures are loud: a one-line muted error naming the endpoint — never a
   silently hidden element. */
const PDETAIL_EP={
  block:id=>`/api/blocks/${encodeURIComponent(id)}`,
  dataset:id=>`/api/datasets/${encodeURIComponent(id)}`,
  text:id=>`/api/texts/${encodeURIComponent(id)}`,
  sachverhalt:id=>`/api/sachverhalte/${encodeURIComponent(id)}`,
  arrangement:id=>`/api/arrangements/${encodeURIComponent(id)}`,
};
function pImgErr(img){ // no silent onerror hiding: a broken figure names its endpoint
  const p=document.createElement("p"); p.className="muted"; p.style.fontSize="12px";
  p.textContent="⚠ Bild nicht ladbar: "+img.getAttribute("src");
  img.replaceWith(p);
}
function pDetail(e){
  if(!PDETAIL_EP[e.kind]) return `<p class="muted" style="font-size:12.5px">Vollansicht: Korpus → ${esc(e.kind)}.</p>`;
  const key=e.kind+":"+e.id, d=PQ.details[key];
  if(!d){ pLoadDetail(e.kind,e.id); return `<p class="muted">Detail lädt…</p>`; }
  if(d.state==="loading") return `<p class="muted">Detail lädt…</p>`;
  if(d.state==="err") return `<p class="muted">⚠ Detail nicht ladbar — ${esc(d.ep)}: ${esc(d.msg)}. Vollansicht: Korpus → ${esc(e.kind)}.</p>`;
  return {block:pdBlock,dataset:pdDataset,text:pdText,sachverhalt:pdSachverhalt,arrangement:pdArrangement}[e.kind](e.id,d.data);
}
async function pLoadDetail(kind,id){
  const key=kind+":"+id, ep=PDETAIL_EP[kind](id);
  PQ.details[key]={state:"loading"};
  try{
    const r=await fetch(ep);
    if(!r.ok) throw new Error("HTTP "+r.status);
    PQ.details[key]={state:"ok",data:await r.json()};
  }catch(err){ PQ.details[key]={state:"err",ep,msg:String((err&&err.message)||err)}; }
  const cur=PQ.entries[PQ.idx];
  if(cur&&cur.kind===kind&&cur.id===id) drawPruefen();  // redraw only if still the current entry
}
function pdBlock(id,lb){
  // the full block as the Bausteine view renders it: prompt, payload, answer key,
  // kind/Niveau/Dimensionen badges + figures built from the travelling spec (3c)
  return `<div style="margin:8px 0">${blk(lb.block,null,r=>`/api/blocks/${encodeURIComponent(id)}/asset/${encodeURIComponent(r)}`)}</div>
    <p class="muted" style="font-size:12px"><span class="badge">${esc(lb.subject)} ${lb.klasse||''}</span>
      <span class="badge">KB: ${esc(lb.kompetenzbereich||'—')}</span> <span class="badge">Scope: ${esc(lb.scope)}</span>
      ${(lb.competences||[]).length?` dient: ${lb.competences.map(c=>`<code>${esc(c)}</code>`).join(' ')}`:''}</p>`;
}
function pdDataset(id,d){
  // source/licence/Stand/attribution + series + the same figure preview the Datensätze view shows
  const fig=(d.series&&d.series.length)?`<div class="figpre"><img src="/api/datasets/${encodeURIComponent(id)}/figure?series=${encodeURIComponent(d.series[0])}" alt="${esc(id)}" loading="lazy" onerror="pImgErr(this)"></div>`:"";
  const lic=`<span class="badge">${esc(d.licence||"?")}</span> ${d.redistributable?'<span class="cov">einbettbar</span>':'<span class="gap">nur Referenz</span>'}`;
  return `${fig}
    <div class="muted" style="margin-top:6px">${lic} · ${esc(d.publisher||"")}${d.stand?` · Stand ${esc(d.stand)}`:""}${d.retrieved?` · geholt ${esc(d.retrieved)}`:""}</div>
    <div class="muted">Serien: ${(d.series||[]).map(s=>`<span class="badge">${esc(s)}</span>`).join("")||"—"}</div>
    <div class="muted" style="font-size:11px">${esc(d.attribution||"")}${d.url?` · <a href="${esc(d.url)}" target="_blank" rel="noopener">Quelle</a>`:""}</div>`;
}
function pdText(id,d){
  const kinds={}; (d.annotations||[]).forEach(a=>kinds[a.kind]=(kinds[a.kind]||0)+1);
  const lines=(d.text||"").split("\n").map((l,i)=>l.trim()?`<span class="muted">${i+1}</span> ${esc(l)}`:"").join("<br>");
  const pma=d.rights_basis==="public_domain_pma"?`<span class="cov">gemeinfrei (†${d.author_death_year})</span>`
    :`<span class="badge">${esc(d.rights_basis||(d.origin==="constructed"?"konstruiert (kein Rechte-Gate)":"—"))}</span>`;
  return `<div class="muted">${esc(d.author||"")}${d.genre?` · ${esc(d.genre)}`:""}${d.cefr?` · ${esc(d.cefr)}`:""} · ${d.n_lines} Zeilen · ${pma}${d.medium==="audio"?' · <span class="badge">🔊 Hörtext (TTS)</span>':''}</div>
    <div style="font-family:Georgia,serif;font-size:13px;line-height:1.5;margin:6px 0;padding:6px 10px;border-left:2px solid #ccc;max-height:300px;overflow:auto">${lines}</div>
    <div class="muted">Annotationen: ${Object.entries(kinds).map(([k,n])=>`<span class="badge">${esc(k)} ${n}</span>`).join("")||"—"}</div>
    <div class="muted" style="font-size:11px">${esc(d.attribution||"")}${d.url?` · <a href="${esc(d.url)}" target="_blank" rel="noopener">Quelle</a>`:""}</div>`;
}
function pdSachverhalt(id,d){
  const tl=(d.timeline||[]).slice(0,6).map(e=>`<span class="badge">${esc(String(e.at))} ${esc(e.label)}</span>`).join(" ");
  const ac=(d.actors||[]).slice(0,4).map(a=>`<span class="badge">${esc(a.name)}</span>`).join(" ");
  const ce=(d.causes||[]).slice(0,3).map(c=>`<div class="muted">${esc(c.cause)} → ${esc(c.effect)}</div>`).join("");
  const cs=(d.concepts||[]).slice(0,3).map(c=>`<div class="muted"><b>${esc(c.term)}</b>: ${esc(c.definition)}</div>`).join("");
  const first=t=>{const s=(t||"").trim();return s.length>200?s.slice(0,200)+"…":s;};
  const dar=(d.darstellung||[]).map(s=>`<div style="margin:4px 0"><b>${esc(s.heading)}</b> — ${esc(first(s.body))}</div>`).join("");
  const src=(d.facts_sources||[]).map(q=>`${esc(q.title)}${q.publisher?` · ${esc(q.publisher)}`:""}${q.licence?` · ${esc(q.licence)}`:""} <span class="badge">role=${esc(q.role)}</span>${q.url?` · <a href="${esc(q.url)}" target="_blank" rel="noopener">Quelle</a>`:""}`).join("<br>");
  return `<div class="muted">${d.n_timeline} Ereignisse · ${d.n_actors} Akteure · ${d.n_causes} Wirk.-Verbindungen · ${d.n_concepts} Begriffe · ${d.n_darstellung} Abschnitte${d.leitfrage?` · <b>Leitfrage:</b> ${esc(d.leitfrage)}`:""}</div>
    <div style="margin:6px 0">${tl}${ac?`<div style="margin-top:4px">${ac}</div>`:""}</div>${ce}${cs}
    <div style="font-size:13px;line-height:1.5;margin:6px 0;padding:6px 10px;border-left:2px solid #ccc;max-height:240px;overflow:auto">${dar}</div>
    <div class="muted" style="font-size:11px">Quellen (role=facts): ${src||"—"}</div>`;
}
function pdArrangement(id,rec){
  const a=rec.arrangement||{}, roles=a.roles||[];
  const phases=(a.phases||[]).length?`<table style="margin-top:8px"><thead><tr><th>Phase</th><th>Sozialform</th><th>Min</th><th>Was passiert</th></tr></thead><tbody>
      ${a.phases.map(p=>`<tr><td>${esc(p.label)}</td><td>${_GRP[p.grouping]||esc(p.grouping)}</td><td>${p.minutes}</td><td>${esc(rt(p.what_happens))}</td></tr>`).join("")}</tbody></table>`:"";
  const rls=roles.length?`<table style="margin-top:8px"><thead><tr><th>Rolle</th><th>Schwerpunkt-Kompetenzen</th></tr></thead><tbody>
      ${roles.map(r=>`<tr><td>${esc(rt(r.label))}</td><td>${_roleServed(r).map(c=>`<code>${esc(c)}</code>`).join(" ")||"—"}</td></tr>`).join("")}</tbody></table>`:"";
  return `<iframe src="/api/arrangements/${encodeURIComponent(id)}/pdf/orchestration" style="width:100%;height:380px;border:1px solid #ddd;border-radius:8px;margin:8px 0 0"></iframe>${phases}${rls}`;
}

function setLane(t){ PQ.lane=t; PQ.entries=PQ.all.filter(e=>!t||e.tier===t); PQ.idx=0; drawPruefen(); }
function pFrame(id,k){ const f=$("#pframe"); if(f) f.src=`/api/items/${id}/pdf/${k}`; }
async function pDecide(action){
  const e=PQ.entries[PQ.idx]; if(!e) return;
  let note="";
  if(action==="reject") note=prompt("Grund (optional):")||"";
  if(action==="revise"){
    const n=prompt("Überarbeiten — was ist zu ändern? (erforderlich)");
    if(n===null||!n.trim()) return;                 // abgebrochen / leer → keine Entscheidung
    note=n.trim();
  }
  await jpost(`/api/review/${e.kind}/${e.id}/decision`,{action,note});
  if(action==="revise"){                            // Überarbeiten: bleibt in der Queue, nur markiert
    e.revise_flagged=true;
    drawPruefen();                                  // Chip erscheint; Karte bleibt fokussiert
    const fl=$("#p-flash"); if(fl) fl.textContent="Überarbeiten vermerkt — Eintrag bleibt in der Queue.";
    return;
  }
  PQ.all=PQ.all.filter(x=>!(x.kind===e.kind&&x.id===e.id));
  PQ.lanes[e.tier]=Math.max(0,(PQ.lanes[e.tier]||1)-1);
  PQ.entries.splice(PQ.idx,1);
  if(PQ.idx>=PQ.entries.length) PQ.idx=Math.max(0,PQ.entries.length-1);
  drawPruefen();
}
async function laneApprove(){
  const all=PQ.all.filter(x=>x.tier==="bestaetigen");
  // safety: flagged entries (Prüf-Hinweise, Überarbeiten-Vermerk oder Triage-★ ≤2) bleiben
  // zur Einzelprüfung — die Sammelfreigabe umfasst nur, wogegen nichts eingewendet wurde
  const clean=all.filter(e=>!e.n_warnings && !e.revise_flagged && !(e.triage&&e.triage.rating&&e.triage.rating<=2));
  const held=all.length-clean.length;
  if(!clean.length){ alert("Alle Einträge dieser Lane tragen Hinweise — bitte einzeln prüfen."); return; }
  if(!confirm(`${clean.length} unauffällige Einträge freigeben?`+(held?` (${held} mit Hinweisen bleiben zur Einzelprüfung)`:""))) return;
  for(const e of clean)
    await jpost(`/api/review/${e.kind}/${e.id}/decision`,{action:"approve"});
  renderPruefen();
}
async function pRate(n){
  const e=PQ.entries[PQ.idx]; if(!e) return;
  await jpost("/api/feedback",{target_kind:e.kind,target_id:e.id,rating:n,comment:"",tags:[]});
  const fl=$("#p-flash"); if(fl) fl.textContent=`Bewertung ${n} ★ gespeichert.`;
}
document.addEventListener("keydown",ev=>{
  if(TAB!=="pruefen") return;
  const el=document.activeElement;
  if(el&&["INPUT","TEXTAREA","SELECT"].includes(el.tagName)) return;
  if(ev.key==="j"||ev.key==="ArrowRight"){ if(PQ.idx<PQ.entries.length-1){PQ.idx++; drawPruefen();} }
  else if(ev.key==="k"||ev.key==="ArrowLeft"){ if(PQ.idx>0){PQ.idx--; drawPruefen();} }
  else if(ev.key==="a") pDecide("approve");
  else if(ev.key==="u") pDecide("revise");
  else if(ev.key==="x") pDecide("reject");
  else if("12345".includes(ev.key)) pRate(+ev.key);
});

/* ---------- actions ---------- */
async function act(id,kind){
  const noteEl = $("#note"); const note = noteEl? noteEl.value : "";
  await jpost(`/api/items/${id}/${kind}`,{note});
  setTimeout(refresh, 150);
}

renderTabs(); buildShell(); refresh();
setInterval(()=>{ if(TAB==="pruefen") return; if(TAB!=="planen" || !document.activeElement || !["INPUT","TEXTAREA"].includes(document.activeElement.tagName)) refresh(); }, 4000);
</script>
