# Übergreifende-Themen legend: 6 = Medienbildung, 11 = Umweltbildung.
#
# Each competence id is PHY.US.<klasse>.<kompetenzbereich>.<n>. dimensions are
# DimensionRefs into the Physik (Naturwissenschaften) W/E/S model.

subject: Physik
stufe: Unterstufe

# grade map (handoff §2) — used by grade_check.
grade_map:
  2: ["Sehen und Hören", "Optische Systeme"]
  3: ["Mechanik", "Elektrizität und Magnetismus", "Energie"]
  4: ["Wetter und Klima", "Strahlung und Radioaktivität"]

competences:
