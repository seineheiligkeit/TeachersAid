  - id: PHY.US.4.STR.04
    kompetenzbereich: "Strahlung und Radioaktivität"
    klasse: 4
    text: >-
      Mit altersgemäßen Informationen zu aktueller Forschung umgehen.
    dimensions: ["W", "E", "S"]
