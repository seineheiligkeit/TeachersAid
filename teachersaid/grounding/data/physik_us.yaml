      Die Wechselwirkung der Strahlungsarten (sichtbar / UV / IR / ionisierend)
      mit Materie analysieren und das Risiko bewerten.
    dimensions: ["E", "S"]
    uebergreifende_themen: [11]
    source_ref: "strahlung-rack.md · STR.02"
  - id: PHY.US.4.STR.03
    kompetenzbereich: "Strahlung und Radioaktivität"
    klasse: 4
